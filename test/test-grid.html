<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTV UI 테스트 페이지</title>

    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">

    <!-- SBGrid3 CSS -->
    <link rel="stylesheet" href="../src/assets/SBGrid3/css/sbgrid3.min.css">

    <!-- CTV UI CSS -->
    <link rel="stylesheet" href="../dist/cwws-com-ui.css">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #409eff;
        }

        .vue-container {
            min-height: 600px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CTV UI 컴포넌트 테스트 - 그리드 예제</h1>

        <div id="app" class="vue-container">
            <ctv-query-filter id="filter1" :columns="4" :fields="filterFields" target="grid1">
            </ctv-query-filter>

            <ctv-data-grid id="grid1" :grid-config="gridConfig" :query="queryConfig" :editable="true">
            </ctv-data-grid>
        </div>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus"></script>

    <!-- SBGrid3 -->
    <script src="../src/assets/SBGrid3/license.js"></script>
    <script src="../src/assets/SBGrid3/sbgrid3.js"></script>

    <!-- CTV UI Library -->
    <script src="../dist/ctv-ui.umd.js"></script>

    <!-- Test Page Logic -->
    <script src="test-grid.js"></script>
</body>

</html>
