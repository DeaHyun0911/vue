<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTV UI 테스트 - syncForm (Grid ↔ Form 동기화)</title>

    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">

    <!-- SBGrid3 CSS -->
    <link rel="stylesheet" href="../src/assets/SBGrid3/css/sbgrid3.min.css">

    <!-- CTV UI CSS -->
    <link rel="stylesheet" href="../dist/cwws-com-ui.css">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #409eff;
        }

        .vue-container {
            min-height: 600px;
        }

        .form-section {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #e4e7ed;
            border-radius: 4px;
            background: #fafafa;
        }

        .form-section h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #606266;
            border-left: 3px solid #409eff;
            padding-left: 8px;
        }

        .debug-section {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CTV UI - syncForm 테스트 (Grid ↔ Form 양방향 동기화)</h1>

        <div id="app" class="vue-container">
            <!-- 필터 영역 -->
            <ctv-query-filter id="filter1" :columns="4" :fields="filterFields" target="grid1">
            </ctv-query-filter>

            <!-- 툴박스 -->
            <ctv-tool-box target="grid1" :left="toolBoxConfig.left" :right="toolBoxConfig.right"></ctv-tool-box>

            <!-- 그리드 (setting 방식) -->
            <ctv-data-grid :setting="masterGrid"></ctv-data-grid>

            <!-- 폼 영역: 그리드 포커스 행과 양방향 동기화 -->
            <div class="form-section">
                <h3>상세 정보 (syncForm - 그리드 포커스행과 자동 동기화)</h3>
                <ctv-form :model="form" :columns="2" label-width="130px">
                    <ctv-form-item label="프로그램ID">
                        <ctv-input field="ID_PGM" title="" :label-width="0" readonly />
                    </ctv-form-item>
                    <ctv-form-item label="프로그램명(한국어)">
                        <ctv-input field="NM_KOR_PGM" title="" :label-width="0" />
                    </ctv-form-item>
                    <ctv-form-item label="프로그램명(영어)">
                        <ctv-input field="NM_ENG_PGM" title="" :label-width="0" />
                    </ctv-form-item>
                    <ctv-form-item label="사용유무">
                        <ctv-select v-model="form.YN_USE" title="" :label-width="0" :options="options.YN_USE" />
                    </ctv-form-item>
                    <ctv-form-item label="비고" style="grid-column: span 2;">
                        <ctv-textarea field="BIGO" title="" :label-width="0" :rows="3" />
                    </ctv-form-item>
                </ctv-form>
            </div>

            <!-- 디버그 영역 -->
            <div class="debug-section">
                <strong>[Debug] form 상태:</strong>
                {{ JSON.stringify(form, null, 2) }}
            </div>
        </div>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus"></script>

    <!-- SBGrid3 -->
    <script src="../src/assets/SBGrid3/license.js"></script>
    <script src="../src/assets/SBGrid3/sbgrid3.js"></script>

    <!-- CTV UI Library -->
    <script src="../dist/ctv-ui.umd.js"></script>
    <script src="mock-data.js"></script>
    <script src="test-grid.js"></script>
</body>

</html>
