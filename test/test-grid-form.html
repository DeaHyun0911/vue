<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTV UI Test - Grid + Form Sync</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <link rel="stylesheet" href="../src/assets/SBGrid3/css/sbgrid3.min.css">
    <link rel="stylesheet" href="../dist/cwws-com-ui.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .h-100 {
            height: 100%;
        }

        .flex-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div id="app">
        <ctv-container aside-width="50%" gap="16px">
            <template #header>
                <div
                    style="padding: 10px; background: #f0f2f5; border-bottom: 1px solid #dcdfe6; display: flex; justify-content: space-between; align-items: center;">
                    <h3>Grid + Form Sync Example</h3>
                    <ctv-tool-box :setting="toolBox"></ctv-tool-box>
                </div>
            </template>

            <!-- Left: Grid -->
            <template #aside>
                <div class="h-100 flex-column">
                    <ctv-data-grid id="grid1" :setting="mainGrid"></ctv-data-grid>
                </div>
            </template>

            <!-- Right: Form -->
            <div class="h-100 flex-column" style="padding: 20px; border-left: 1px solid #eee; overflow-y: auto;">
                <h4 style="margin-top:0;">Edit Selected Row</h4>

                <!-- Bound to Grid's focusData -->
                <ctv-form v-bind="formSetting" :model="mainGrid.focusData">
                    <ctv-form-item label="Code ID">
                        <ctv-input v-model="mainGrid.focusData.CD_MST" disabled></ctv-input>
                    </ctv-form-item>
                    <ctv-form-item label="Code Name">
                        <ctv-input v-model="mainGrid.focusData.NM_CODE"></ctv-input>
                    </ctv-form-item>
                    <ctv-form-item label="System Type">
                        <ctv-select v-model="mainGrid.focusData.FG_SYS" :options="options.FG_SYS"></ctv-select>
                    </ctv-form-item>
                    <ctv-form-item label="Use Y/N">
                        <ctv-switch v-model="mainGrid.focusData.YN_USE" active-value="Y"
                            inactive-value="N"></ctv-switch>
                    </ctv-form-item>
                    <ctv-form-item label="Description" style="grid-column: span 2;">
                        <ctv-textarea v-model="mainGrid.focusData.BIGO" :rows="5"></ctv-textarea>
                    </ctv-form-item>
                </ctv-form>

                <div
                    style="margin-top: 20px; font-size: 12px; color: #666; background: #f8f9fa; padding: 10px; border-radius: 4px;">
                    <strong>Live Data Sync:</strong>
                    <pre>{{ mainGrid.focusData }}</pre>
                </div>
            </div>
        </ctv-container>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="../src/assets/SBGrid3/license.js"></script>
    <script src="../src/assets/SBGrid3/sbgrid3.js"></script>
    <script src="../dist/ctv-ui.umd.js"></script>
    <script src="test-grid-form.js"></script>
</body>

</html>
