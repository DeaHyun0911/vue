<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTV UI Test - Grid + Form Sync</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <link rel="stylesheet" href="../src/assets/SBGrid3/css/sbgrid3.min.css">
    <link rel="stylesheet" href="../dist/cwws-com-ui.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .h-100 {
            height: 100%;
        }

        .flex-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div id="app">
        <ctv-container aside-width="50%" gap="16px">
            <template #header>
                <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                    <ctv-query-filter :setting="filter" v-model:field="query"></ctv-query-filter>
                    <ctv-tool-box :setting="toolBox"></ctv-tool-box>
                </div>
            </template>

            <!-- Left: Grid -->
            <template #aside>
                <div class="h-100 flex-column">
                    <ctv-data-grid id="grid1" :setting="mainGrid"></ctv-data-grid>
                </div>
            </template>

            <!-- Right: Form -->
            <div class="h-100 flex-column"
                style="background: #fff; padding: 20px; border: 1px solid var(--color-grid-border-2); overflow-y: auto; border-radius: 4px;">
                <h4 style="margin-top:0;">Edit Selected Row</h4>

                <!-- Bound to formModel (양방향 동기화) -->
                <ctv-form v-bind="form" :model="formModel">
                    <ctv-form-item label="Code ID">
                        <ctv-input field="CD_MST" disabled></ctv-input>
                    </ctv-form-item>
                    <ctv-form-item label="Code Name">
                        <ctv-input field="NM_CODE"></ctv-input>
                    </ctv-form-item>
                    <ctv-form-item label="System Type">
                        <ctv-select field="FG_SYS" :options="options.FG_SYS"></ctv-select>
                    </ctv-form-item>
                    <ctv-form-item label="Use Y/N">
                        <ctv-switch field="YN_USE" active-value="Y" inactive-value="N"></ctv-switch>
                    </ctv-form-item>
                    <ctv-form-item label="Description" style="grid-column: span 2;">
                        <ctv-textarea field="BIGO" :rows="5"></ctv-textarea>
                    </ctv-form-item>
                </ctv-form>

                <div
                    style="margin-top: 20px; font-size: 12px; color: #666; background: #f8f9fa; padding: 10px; border-radius: 4px;">
                    <strong>Live Data Sync (Grid ↔ Form):</strong>
                    <pre>{{ formModel }}</pre>
                </div>
            </div>
        </ctv-container>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/element-plus/dist/locale/ko.min.mjs"></script>
    <script src="../src/assets/SBGrid3/license.js"></script>
    <script src="../src/assets/SBGrid3/sbgrid3.js"></script>
    <script src="../dist/ctv-ui.umd.js"></script>
    <script src="mock-data.js"></script>
    <script src="test-grid-form.js"></script>
</body>

</html>
